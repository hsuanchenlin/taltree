[package]
name = "taltree"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Local-first daily-budget dependency planner rendered as a terminal talent tree."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hsuan-chen-lin/taltree"
keywords = ["tui", "planner", "dag", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "taltree"
path = "src/main.rs"

[lib]
name = "taltree"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
